<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        background: #fafafa;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 12px;
        color: #666;
        margin: 4px 0;
        line-height: 1.4;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: #000;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .status {
        font-size: 11px;
        margin-top: 8px;
      }
      .settings {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }
      .settings label {
        display: block;
        font-size: 11px;
        color: #666;
        margin: 8px 0 4px;
      }
      .settings input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        font-size: 12px;
      }
      .settings button {
        margin-top: 10px;
        padding: 7px 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Jobtwin Autofill</h1>
    <p id="status">Open a Greenhouse or Lever application to autofill your saved profile.</p>
    <button id="fill">Fill current form</button>
    <div id="result" class="status"></div>

    <div class="settings">
      <label for="apiUrl">API URL</label>
      <input id="apiUrl" placeholder="https://your-deployment.com" />
      <label for="token">API token</label>
      <input id="token" placeholder="jtx_... (from Jobtwin profile)" />
      <button id="save">Save & sync</button>
      <div id="save-status" class="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
