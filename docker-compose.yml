services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobtwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtwin
      POSTGRES_PASSWORD: jobtwin
      POSTGRES_DB: jobtwin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jobtwin-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: